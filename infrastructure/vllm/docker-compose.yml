services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: brand-agent-vllm
    ports:
      - "8001:8000"
    environment:
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command:
      - "--model"
      - "Qwen/Qwen3-VL-8B-Instruct"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--api-key"
      - "change-this-in-production"
      - "--max-model-len"
      - "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# This is a production-reference manifest, not a laptop setup.
# Place vLLM on a GPU host/container service and keep port 8000 private.
# The FastAPI container should call:
#   VLLM_BASE_URL=http://vllm:8000/v1
