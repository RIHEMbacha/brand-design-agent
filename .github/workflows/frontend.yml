name: Build and Deploy Frontend

on:
  push:
    branches:
      - master
    paths:
      - "brand-design-agent-frontend-split/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./brand-design-agent-frontend-split
          file: ./brand-design-agent-frontend-split/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-brand-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-brand-frontend:${{ github.sha }}
